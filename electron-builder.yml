appId: com.electron.app
productName: 文件处理
directories:
  buildResources: 'assets'

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 运行时二进制只通过 extraResources 提供，避免同时打进 asar 造成体积翻倍
  - '!resources/**'

asarUnpack:
  - 'node_modules/sharp/**'
  - 'node_modules/@img/**'

extraResources:
  - from: 'resources'
    to: 'resources'
    filter:
      [
        '!ffmpeg/ffmpeg.exe',
        '!ffprobe/ffprobe.exe',
        '!ffmpeg/ffmpeg',
        '!ffprobe/ffprobe',
        '!**/.DS_Store'
      ]

win:
  executableName: 文件处理
  extraResources:
    - from: 'resources/ffmpeg/ffmpeg.exe'
      to: 'resources/ffmpeg/ffmpeg.exe'
    - from: 'resources/ffprobe/ffprobe.exe'
      to: 'resources/ffprobe/ffprobe.exe'
  target:
    - nsis

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: false
  menuCategory: true
  displayLanguageSelector: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  warningsAsErrors: false
  unicode: true

mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents - folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads - folder.
    - NSCameraUseContinuityCameraDeviceType: true
  notarize: false
  extraResources:
    - from: 'resources/ffmpeg/ffmpeg'
      to: 'resources/ffmpeg/ffmpeg'
    - from: 'resources/ffprobe/ffprobe'
      to: 'resources/ffprobe/ffprobe'
  icon: resources/icon.png

dmg:
  artifactName: ${name}-${version}.${ext}

linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  icon: resources/icon.png

appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false

publish:
  provider: generic
  url:

protocols:
  - name: MyApp Protocol
    schemes:
      - myapp
